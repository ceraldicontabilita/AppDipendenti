version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns: ["*"]
